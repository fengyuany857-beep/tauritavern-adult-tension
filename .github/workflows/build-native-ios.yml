name: Build Adult Tension Native iOS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - BUILD_TRIGGER

permissions:
  contents: write

concurrency:
  group: adult-tension-native-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      UPSTREAM_SHA: 3a8c5401c859ac15ac11f3339846360615232896
      PATCH_SHA256: ab08a021d5ff0158b283ef25bfc6aa7f0efec05328ca99e489eea130d566fe10
      BUILD11_PATCH_SHA256: f32fced72ac46136d17ef0e4a916d0285bff178aaaccdd1e6ef17aa7e33f36c7
      TAURITAVERN_IOS_POLICY_PROFILE: full
      TAURITAVERN_DISTRIBUTION_FLAVOR: adult_tension_selfsign
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout build control repository
        uses: actions/checkout@v4
        with:
          path: control

      - name: Export build provenance
        shell: bash
        run: |
          {
            echo "TAURITAVERN_CONTROL_SHA=$GITHUB_SHA"
            echo "TAURITAVERN_BUILD_RUN_ID=$GITHUB_RUN_ID"
            echo "TAURITAVERN_BUILD_RUN_NUMBER=$GITHUB_RUN_NUMBER"
            echo "TAURITAVERN_UPSTREAM_SHA=$UPSTREAM_SHA"
          } >> "$GITHUB_ENV"

      - name: Checkout exact TauriTavern baseline
        uses: actions/checkout@v4
        with:
          repository: Darkatse/TauriTavern
          ref: 3a8c5401c859ac15ac11f3339846360615232896
          path: source

      - name: Reconstruct and verify native patches
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib

          parts = sorted(Path('control/patch64').glob('p*.txt'))
          assert len(parts) == 12, f'expected 12 native patch chunks, found {len(parts)}'
          encoded = ''.join(p.read_text().strip() for p in parts)
          patch = gzip.decompress(base64.b64decode(encoded))
          Path('/tmp/native.patch').write_bytes(patch)
          digest = hashlib.sha256(patch).hexdigest()
          print('native patch sha256:', digest)
          assert digest == 'ab08a021d5ff0158b283ef25bfc6aa7f0efec05328ca99e489eea130d566fe10', digest

          parts = sorted(Path('control/build11patch64').glob('p*.txt'))
          assert len(parts) == 5, f'expected 5 Build 11 patch chunks, found {len(parts)}'
          encoded = ''.join(p.read_text().strip() for p in parts)
          patch = gzip.decompress(base64.b64decode(encoded))
          Path('/tmp/build11.patch').write_bytes(patch)
          digest = hashlib.sha256(patch).hexdigest()
          print('Build 11 patch sha256:', digest)
          assert digest == 'f32fced72ac46136d17ef0e4a916d0285bff178aaaccdd1e6ef17aa7e33f36c7', digest
          PY

      - name: Apply native RP patch stack
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          git apply --check /tmp/native.patch
          git apply /tmp/native.patch
          shopt -s nullglob
          for patch in ../control/patches/*.patch; do
            echo "Applying incremental patch: $patch"
            git apply --check "$patch"
            git apply "$patch"
          done
          echo "Applying Build 11 integrity patch"
          git apply --check /tmp/build11.patch
          git apply /tmp/build11.patch
          for patch in ../control/build11-post/*.patch; do
            echo "Applying Build 11 post patch: $patch"
            git apply --check "$patch"
            git apply "$patch"
          done
          for patch in ../control/build14-post/*.patch; do
            echo "Applying Build 14 architecture patch: $patch"
            normalized="$(mktemp)"
            sed 's/^ diff --git /diff --git /' "$patch" > "$normalized"
            git apply --recount --check "$normalized"
            git apply --recount "$normalized"
            rm -f "$normalized"
          done
          git diff --check

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: source/src-tauri -> target

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: source
        run: pnpm install --frozen-lockfile

      - name: Run quality gates, build iPhone app, verify IPA, publish self-sign release
        shell: bash
        run: bash control/ci/build-with-status.sh

      - name: Upload unsigned iOS artifact backup
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: TauriTavern-Adult-Tension-Native-iOS-${{ github.run_number }}
          path: |
            source/dist/ios-unsigned/TauriTavern-unsigned.ipa
            source/dist/ios-unsigned/TauriTavern.app.zip
            source/dist/ios-unsigned/build-info.json
            source/dist/ios-unsigned/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
