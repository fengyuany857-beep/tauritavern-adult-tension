name: Export RP Runtime Source

on:
  push:
    branches: [main]
    paths:
      - RP_RUNTIME_EXPORT_TRIGGER

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout control repo
        uses: actions/checkout@v4
        with:
          path: control

      - name: Checkout exact TauriTavern baseline
        uses: actions/checkout@v4
        with:
          repository: Darkatse/TauriTavern
          ref: 3a8c5401c859ac15ac11f3339846360615232896
          path: source

      - name: Reconstruct and apply Build 14 patch stack
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib

          parts = sorted(Path('control/patch64').glob('p*.txt'))
          assert len(parts) == 12, len(parts)
          encoded = ''.join(p.read_text().strip() for p in parts)
          patch = gzip.decompress(base64.b64decode(encoded))
          digest = hashlib.sha256(patch).hexdigest()
          assert digest == 'ab08a021d5ff0158b283ef25bfc6aa7f0efec05328ca99e489eea130d566fe10', digest
          Path('/tmp/native.patch').write_bytes(patch)

          parts = sorted(Path('control/build11patch64').glob('p*.txt'))
          assert len(parts) == 5, len(parts)
          encoded = ''.join(p.read_text().strip() for p in parts)
          patch = gzip.decompress(base64.b64decode(encoded))
          digest = hashlib.sha256(patch).hexdigest()
          assert digest == 'f32fced72ac46136d17ef0e4a916d0285bff178aaaccdd1e6ef17aa7e33f36c7', digest
          Path('/tmp/build11.patch').write_bytes(patch)
          PY
          cd source
          git apply --check /tmp/native.patch
          git apply /tmp/native.patch
          shopt -s nullglob
          for patch in ../control/patches/*.patch; do
            git apply --check "$patch"
            git apply "$patch"
          done
          git apply --check /tmp/build11.patch
          git apply /tmp/build11.patch
          for patch in ../control/build11-post/*.patch; do
            git apply --check "$patch"
            git apply "$patch"
          done
          for patch in ../control/build14-post/*.patch; do
            git apply --check "$patch"
            git apply "$patch"
          done
          git diff --check

      - name: Collect RP and persistence runtime source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p export
          cd source
          {
            git diff --name-only
            find src-tauri/crates -type f \( -name '*.rs' -o -name '*.toml' \) | grep -E 'agent|workspace|persist|rp|state|run' || true
          } | sort -u > ../export/candidates.txt
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            if grep -Eqi 'rp\.stage_turn|rp_stage_turn|persist/rp/state\.json|Adult Tension|persistent state|persistStateId|persist_state|workspace\.finish|stage turn|WorldManifest|SessionIdentity|CharacterEntity|MemoryTier' "$f"; then
              mkdir -p "../export/$(dirname "$f")"
              cp "$f" "../export/$f"
            fi
          done < ../export/candidates.txt
          git diff -- src-tauri > ../export/native-current.diff
          git status --short > ../export/status.txt
          cd ..
          find export -type f -maxdepth 12 -print | sort

      - name: Upload source export
        uses: actions/upload-artifact@v4
        with:
          name: RP-Runtime-Source-Build14
          path: export/
          if-no-files-found: error
          retention-days: 7
