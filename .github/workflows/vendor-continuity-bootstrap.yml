name: Vendor Continuity Bootstrap

on:
  push:
    branches: [main]
    paths:
      - CONTINUITY_BOOTSTRAP_TRIGGER

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout control repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download, verify, and vendor Continuity graduation package
        shell: bash
        env:
          CONTINUITY_URL: "https://sdmntprnznorth.oaiusercontent.com/files/00000000-0080-820b-8754-336077543479/raw?se=2026-09-10T07%3A59%3A05Z&sp=r&sv=2026-02-06&sr=b&scid=671aa445-64f2-541e-a1d0-da33f5fc27ed&skoid=f5e14fda-2af7-44a3-9d18-d372ffcad871&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-10T03%3A08%3A47Z&ske=2026-09-11T03%3A08%3A47Z&sks=b&skv=2026-02-06&sig=LQi4MUy0Gpm88sTGt3X%2Ba9UnmfXFHpARzUhYAwMP3wE%3D"
          CONTINUITY_SHA256: "4fbead4ed0deaa157f498a32ae6ee7ba077eaee0f046a1b71eb194c31a3d9201"
          CONTINUITY_NAME: "adult-tension-continuity-graduation-final-v2-tauritavern-fixed.zip"
        run: |
          set -euo pipefail
          mkdir -p vendor/continuity
          curl --fail --location --retry 3 --retry-delay 2 "$CONTINUITY_URL" -o "vendor/continuity/$CONTINUITY_NAME"
          printf '%s  %s\n' "$CONTINUITY_SHA256" "vendor/continuity/$CONTINUITY_NAME" | sha256sum -c -
          unzip -t "vendor/continuity/$CONTINUITY_NAME" >/dev/null
          unzip -p "vendor/continuity/$CONTINUITY_NAME" SKILL.md | grep -q '^name: adult-tension-continuity$'
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "vendor/continuity/$CONTINUITY_NAME"
          if git diff --cached --quiet; then
            echo 'Continuity vendor package already present and unchanged.'
            exit 0
          fi
          git commit -m 'vendor: pin continuity graduation final v2 binary'
          git push origin HEAD:main
