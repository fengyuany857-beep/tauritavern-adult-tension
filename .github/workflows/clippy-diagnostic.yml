name: Adult Tension Clippy Diagnostic

on:
  push:
    branches: [main]
    paths:
      - CLIPPY_TRIGGER

permissions:
  contents: read

jobs:
  clippy:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout build control repository
        uses: actions/checkout@v4
        with:
          path: control

      - name: Checkout exact TauriTavern baseline
        uses: actions/checkout@v4
        with:
          repository: Darkatse/TauriTavern
          ref: 3a8c5401c859ac15ac11f3339846360615232896
          path: source

      - name: Reconstruct and apply native patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib
          parts = sorted(Path('control/patch64').glob('p*.txt'))
          assert len(parts) == 12
          patch = gzip.decompress(base64.b64decode(''.join(p.read_text().strip() for p in parts)))
          digest = hashlib.sha256(patch).hexdigest()
          assert digest == 'ab08a021d5ff0158b283ef25bfc6aa7f0efec05328ca99e489eea130d566fe10', digest
          Path('/tmp/native.patch').write_bytes(patch)
          PY
          cd source
          git apply --check /tmp/native.patch
          git apply /tmp/native.patch
          git diff --check

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: source/src-tauri -> target

      - name: Run focused Clippy and capture diagnostics
        working-directory: source
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --manifest-path src-tauri/Cargo.toml -p tt-application -p tt-domain --all-targets -- -D warnings 2>&1 | tee "$GITHUB_WORKSPACE/clippy.log"

      - name: Upload Clippy diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: clippy-diagnostics-${{ github.run_number }}
          path: clippy.log
          if-no-files-found: error
          retention-days: 7
