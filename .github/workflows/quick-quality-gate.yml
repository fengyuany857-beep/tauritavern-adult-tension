name: Auto Acceptance Quick Quality Gate

on:
  push:
    branches: [main]
    paths:
      - QUICK_GATE_TRIGGER

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      UPSTREAM_SHA: 3a8c5401c859ac15ac11f3339846360615232896
      TAURITAVERN_DISTRIBUTION_FLAVOR: adult_tension_selfsign
    steps:
      - name: Checkout control repository
        uses: actions/checkout@v4
        with:
          path: control

      - name: Checkout exact upstream
        uses: actions/checkout@v4
        with:
          repository: Darkatse/TauriTavern
          ref: 3a8c5401c859ac15ac11f3339846360615232896
          path: source

      - name: Reconstruct and apply patch stack
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib
          parts = sorted(Path('control/patch64').glob('p*.txt'))
          patch = gzip.decompress(base64.b64decode(''.join(p.read_text().strip() for p in parts)))
          assert hashlib.sha256(patch).hexdigest() == 'ab08a021d5ff0158b283ef25bfc6aa7f0efec05328ca99e489eea130d566fe10'
          Path('/tmp/native.patch').write_bytes(patch)
          parts = sorted(Path('control/build11patch64').glob('p*.txt'))
          patch = gzip.decompress(base64.b64decode(''.join(p.read_text().strip() for p in parts)))
          assert hashlib.sha256(patch).hexdigest() == 'f32fced72ac46136d17ef0e4a916d0285bff178aaaccdd1e6ef17aa7e33f36c7'
          Path('/tmp/build11.patch').write_bytes(patch)
          PY
          cd source
          git apply --check /tmp/native.patch
          git apply /tmp/native.patch
          shopt -s nullglob
          for patch in ../control/patches/*.patch; do git apply --check "$patch"; git apply "$patch"; done
          git apply --check /tmp/build11.patch
          git apply /tmp/build11.patch
          for patch in ../control/build11-post/*.patch; do git apply --check "$patch"; git apply "$patch"; done
          for patch in ../control/build14-post/*.patch; do
            normalized="$(mktemp)"
            sed 's/^ diff --git /diff --git /' "$patch" > "$normalized"
            git apply --recount --check "$normalized"
            git apply --recount "$normalized"
            rm -f "$normalized"
          done
          git diff --check

      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: source
        run: pnpm install --frozen-lockfile

      - name: Acceptance and native contracts
        working-directory: source
        run: node --test tests/agent-rp-native-contract.test.mjs tests/agent-api-contract.test.mjs tests/personal-ios-unsigned-build.test.mjs tests/ios-runtime-acceptance-contract.test.mjs

      - name: Frontend and architecture gates
        working-directory: source
        run: |
          pnpm run check:frontend
          pnpm run check:types
          pnpm run check:logging-boundaries
          pnpm run check:rust-boundaries
          pnpm run test:contracts

      - name: Rust tests
        working-directory: source
        run: pnpm run test:rust

      - name: Rust Clippy
        working-directory: source
        run: pnpm run check:rust:clippy

      - name: Frontend production build
        working-directory: source
        run: pnpm run web:build
