name: Package Adult Tension Runtime Skills

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - SKILL_PACKAGE_TRIGGER

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    env:
      UPSTREAM_SHA: 3a8c5401c859ac15ac11f3339846360615232896
    steps:
      - name: Checkout build control repository
        uses: actions/checkout@v4
        with:
          path: control

      - name: Checkout pinned adult-tension vendor
        uses: actions/checkout@v4
        with:
          repository: daha1216/dsh-adult-tension
          ref: cbfdc623fccc91247cbb37783757fc157406c2a5
          path: adult-tension-src

      - name: Checkout exact TauriTavern baseline
        uses: actions/checkout@v4
        with:
          repository: Darkatse/TauriTavern
          ref: 3a8c5401c859ac15ac11f3339846360615232896
          path: source

      - name: Reconstruct and apply native patch stack
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib

          parts = sorted(Path('control/patch64').glob('p*.txt'))
          assert len(parts) == 12, len(parts)
          encoded = ''.join(p.read_text().strip() for p in parts)
          patch = gzip.decompress(base64.b64decode(encoded))
          digest = hashlib.sha256(patch).hexdigest()
          assert digest == 'ab08a021d5ff0158b283ef25bfc6aa7f0efec05328ca99e489eea130d566fe10', digest
          Path('/tmp/native.patch').write_bytes(patch)

          parts = sorted(Path('control/build11patch64').glob('p*.txt'))
          assert len(parts) == 5, len(parts)
          encoded = ''.join(p.read_text().strip() for p in parts)
          patch = gzip.decompress(base64.b64decode(encoded))
          digest = hashlib.sha256(patch).hexdigest()
          assert digest == 'f32fced72ac46136d17ef0e4a916d0285bff178aaaccdd1e6ef17aa7e33f36c7', digest
          Path('/tmp/build11.patch').write_bytes(patch)
          PY
          cd source
          git apply --check /tmp/native.patch
          git apply /tmp/native.patch
          shopt -s nullglob
          for patch in ../control/patches/*.patch; do
            git apply --check "$patch"
            git apply "$patch"
          done
          git apply --check /tmp/build11.patch
          git apply /tmp/build11.patch
          for patch in ../control/build11-post/*.patch; do
            git apply --check "$patch"
            git apply "$patch"
          done
          for patch in ../control/build14-post/*.patch; do
            normalized="$(mktemp)"
            sed 's/^ diff --git /diff --git /' "$patch" > "$normalized"
            git apply --recount --check "$normalized"
            git apply --recount "$normalized"
            rm -f "$normalized"
          done
          git diff --check
          test -f extras/adult-tension-tauritavern-adapter/SKILL.md

      - name: Create and verify all three Skill packages
        shell: bash
        run: |
          set -euo pipefail
          CONTROL_DIR="$GITHUB_WORKSPACE/control" \
          SOURCE_DIR="$GITHUB_WORKSPACE/source" \
          ADULT_TENSION_SOURCE_DIR="$GITHUB_WORKSPACE/adult-tension-src" \
          SKILL_OUT_DIR="$GITHUB_WORKSPACE/out" \
          bash "$GITHUB_WORKSPACE/control/ci/package-runtime-skills.sh"
          test -f out/adult-tension-cbfdc623.zip
          test -f out/adult-tension-continuity-graduation-final-v2-tauritavern-fixed.zip
          test -f out/adult-tension-tauritavern-adapter-build14.zip
          test -f out/Adult-Tension-3-Skills.zip
          test -f out/skills-manifest.json
          test -f out/SKILL-SHA256SUMS.txt
          (cd out && sha256sum -c SKILL-SHA256SUMS.txt)

      - name: Upload three-Skill packages
        uses: actions/upload-artifact@v4
        with:
          name: Adult-Tension-Runtime-3-Skills-Build14
          path: out/
          if-no-files-found: error
          retention-days: 30
